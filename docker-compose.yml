services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      DB_PATH: /app/data/kitchen-ledger.db
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - kitchen-data:/app/data

volumes:
  kitchen-data:
